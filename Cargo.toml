[package]
name = "zentropy"
version = "0.0.7"
edition = "2021"
rust-version = "1.74"
description = "Zentropy: the smallest legitimate executable explanation of enwik9. A Hutter Prize contender."
license = "MIT"
repository = "https://github.com/infinityabundance/zentropy"
homepage = "https://github.com/infinityabundance/zentropy"
documentation = "https://github.com/infinityabundance/zentropy/tree/master/docs"
readme = "README.md"
keywords = ["compression", "context-mixing", "enwik9", "hutter-prize", "arithmetic-coding"]
categories = ["compression", "algorithms", "command-line-utilities"]
# The scored artifact must be small and deterministic. No external crates in the
# scored path: everything the submission needs is implemented in-tree so that we
# control binary size, determinism and licence inventory exactly.
[dependencies]
# Rayon is used by the *research* plane only: in-process parallelism across
# independent trials (candidate tunes), so a campaign runs N-way on one loaded
# corpus. The Hutter rules do not forbid it (the runtime stays self-contained;
# it is statically linked and touches no files or network), but every linked byte
# is charged to `S`, so the scored stub is built with `--features accepted` and
# does not include it. See docs/HUTTER_RULES.md §4.
rayon = { version = "1", optional = true }

[dev-dependencies]

[lib]
name = "zentropy"
path = "src/lib.rs"

# ---------------------------------------------------------------------------
# Executables
#
# `zentropy` is the research/production driver (compression + decompression +
# harness + courts). It is allowed to be larger than the submission plane; the
# submission packaging step (Phase 12) builds a stripped, feature-gated decoder.
# `zentropy-sfx` is deliberately a separate, minimal decoder-only binary that
# the self-extracting-archive packager will use as its stub.
# ---------------------------------------------------------------------------
[[bin]]
name = "zentropy"
path = "src/bin/zentropy.rs"

[[bin]]
name = "zentropy-sfx"
path = "src/bin/zentropy_sfx.rs"

[features]
# Only ADOPTED mechanisms are in the default (scored) build, plus research-plane
# infrastructure that is useful when developing (`parallel`, `progress`,
# `mem-floor`). Rejected or experimental mechanisms are compiled in explicitly with
# `--features` so they reproduce but do not cost submission bytes.
default = ["accepted", "parallel", "progress", "mem-floor", "learned-train", "procedural", "opportunity", "phase14", "temporal"]
# The scored configuration: exactly the adopted mechanisms. The submission
# packaging builds with `--no-default-features --features accepted` so that
# research-plane machinery (the search layer, rayon) cannot leak into the stub.
# Keep this list == the adopted mechanisms, and nothing else.
#
# `accepted = accepted-core + tune-table`: the two features claim opposite
# halves of one decision (which mechanism owns the high nibble of `tune`), and
# only `tune-table` is adopted. The split exists so the *rejected* APM axis can
# still be reproduced without duplicating this list; see `accepted-core`.
accepted = ["accepted-core", "tune-table"]
# The accepted mechanism set **excluding** the mechanism that owns the `tune`
# high nibble. Research-only: it exists so that `apm-tune` (the rejected Phase-9
# axis) can be rebuilt as `--no-default-features --features
# "accepted-core,apm-tune"` without a second hand-maintained copy of the list
# that could silently drift from `accepted`.
#
# A `compile_error!` in `src/context/mod.rs` refuses to build this set on its
# own, so it cannot be mistaken for a scored configuration.
accepted-core = ["struct-hoist", "column-model", "word-token", "long-match", "sparse-match", "match-byte", "sse-3", "reorder", "learned", "mem-guard"]
# Escape hatch for A31 measurements. `accepted-core` without `tune-table` is the
# *pre-T2 geometry* — the same mechanism set, with the `tune` high nibble inert.
# It exists so the marginal executable cost of `tune-table` can be measured by
# building the two otherwise-identical stubs the rule requires, instead of
# estimating it. Nothing scored enables this: it names a build that is
# *deliberately* missing an adopted mechanism, so it must be asked for by name.
pre-t2-geometry = []
# Research-plane in-process parallelism (rayon). Costs real bytes when linked, so
# it is deliberately outside `accepted`.
parallel = ["dep:rayon"]
# Research-plane progress reporting for long passes (percent, throughput, ETA).
# Outside `accepted`: the scored stub prints nothing and carries none of it.
progress = []
# Research-plane runtime memory floor: abort a long run if the *machine* tightens
# underneath it (with a patience window, so a transient dip from an unrelated
# process cannot discard an hour of work). Outside `accepted`, and deliberately
# so: the judged decoder never arms it, so in the stub it would be pure `S` cost
# with no protective value. See `src/memory.rs`.
mem-floor = []
# Gates the Phase-3 structural-hoisting transform into the binary. Disabling it
# yields an otherwise-identical binary used ONLY to measure the mechanism's
# real executable-byte cost. `S` is authority: an estimate is never allowed to
# decide whether a mechanism is adopted.
struct-hoist = []
# A2: bitwise alphabet geometry (frequency-ordered 256-symbol permutation).
alphabet-perm = []
# A3: information-inheritance cold starts for direct context models.
info-inherit = []
# A17: previous-line / structural-column expert.
column-model = []
# A1.2: case factorization. REJECTED (merge reverses at enwik8, mark-only
# reverses at enwik9); kept only to reproduce the negative result.
case-model = []
# A1.1/A26: corpus-derived frequency-ranked word vocabulary (dictionary stored in
# the archive and charged). ADOPTED at enwik9 (-1,723,929 B); the reverse-id
# variant is the accepted one.
word-token = []
# A1.1/A26 v2: escape-extended word vocabulary (thousands of tokens).
# Experimental; not in the default build until measured on the ladder.
word-token2 = []
# Phase 10.4: recency-ranked token ids (move-to-front, move-to-second). Decoder-
# derivable from the id sequence alone, so it costs zero side-stream bytes; it is
# a *representation identity* experiment, not a coverage one. Implies `word-token`
# because these modes are variants of the v1 tokenizer.
id-order = ["word-token"]
# Phase 10 (research): first-use inline dictionary definitions instead of a
# dictionary header. Expected to land near the noise floor; see PHASE10_PLAN.md.
first-use = ["word-token"]
# Phase 10 (research): subword composition -- whole-word tokens plus BPE units
# derived from the stored vocabulary (so the decoder needs no side information).
subword = ["word-token"]
# Phase 10 (research): instrument the range coder with its own accumulated ideal
# code length, so a representation can be priced by what the model actually
# charges for it (`zentropy vocab-price`). Research-plane and outside `accepted`:
# the accumulator is `f64`, which must never reach a scored artifact.
vocab-price = ["word-token"]
# Phase 4.1: long-distance match tier (a second, longer-minimum match index).
long-match = []
# Phase 4.2: sparse (gapped) match tier.
sparse-match = []
# Phase 4.3: repeat-offset state (MRU distance ring + rep predictors).
rep-state = []
# Phase 4.4: matched-literal expert (context conditioned on predicted byte).
match-byte = []
# Phase 4.5: distance-conditioned match confidence.
dist-match = []
# Phase 4.6: stem / root+affix transform.
stem = []
# Phase 4.7: word-class context expert.
word-class = []
# Phase 4.9: phrase (multi-word) vocabulary.
phrase = []
# Phase 4.10: front-coded dictionary header.
dict-front = []
# Phase 4.8: affix-referenced derived tokens.
affix-token = []
# Phase 5: RePair grammar transform (procedural grammar + rank state).
grammar = []
# Phase 6.1: indirect bit-history state-map experts. REJECTED at enwik9
# (+754,671 B; wins at enwik7/enwik8) — kept to reproduce the negative result.
state-map = []
# Phase 6.4: extra SSE/APM calibration stage keyed on an order-2 context.
# ADOPTED at enwik9 (-1,671,235 B for a measured 256 B of executable); in the
# default (scored) build.
sse-3 = []
# Phase 6.3: an indirect (state-keyed) SSE stage. REJECTED (+26,063 B on
# enwik7). Implies the SSE machinery.
isse = ["sse-3"]
# Phase 6.7: checksum-verified context slots. REJECTED (+13,779 B on enwik7).
collision = []
# Phase 6.8: bounded PPM-C byte model expert. REJECTED at enwik9 (+61,133 B on
# top of sse-3; wins at enwik7/enwik8) — fixed table capacity.
ppm = []
# Phase 9: the APM adaptation-shift axis of the `tune` byte. REJECTED at enwik9:
# at the best mixer LR the best APM point is 90,996 B *worse* than APM-off
# (169,575,025 vs 169,484,029), so the axis earns nothing and its 288 B of table
# and variable-rate plumbing are not carried. Compiled in explicitly to
# reproduce the negative result; the default build fixes all three shifts at 7,
# which is the pre-Phase-9 behaviour exactly.
#
# Since T2 was adopted this axis can no longer be layered on the *scored* set —
# both claim the high nibble. Reproduce it with:
#
#     cargo test --no-default-features --features "accepted-core,apm-tune"
#     cargo run  --no-default-features --features "accepted-core,apm-tune,progress" -- …
#
# and the `compile_error!` in `src/context/mod.rs` will refuse any build that
# enables both.
apm-tune = []
# T2: the high nibble of `tune` selects a table-size scale (in bits) for the
# direct context experts. The scored ladder capped tables at 2^24 (576 MB for
# enwik9) although the Hutter envelope allows 10 GB, and that cap had no recorded
# justification — it was a corpus-size heuristic.
#
# **ADOPTED** (in `accepted` above). Full `eval` gates on enwik9 with exact
# reconstruction: scale 2 (tune 37) 166,328,552 B (-2,953,787) and scale 3
# (tune 53) 165,344,019 B (-3,938,320) against the accepted 169,282,339 B; peak
# RSS 5.63 GB at scale 3, against the 10 GB rule. The knob is
# *decoder-derivable* by construction: the scale comes from the archive's own
# `tune` byte, so encode and decode cannot disagree.
#
# Mutually exclusive with `apm-tune` (both claim the high nibble); the compiler
# enforces that with a `compile_error!`. Because `accepted` now claims the
# nibble, reproducing the *rejected* APM axis requires building a research binary
# that excludes this feature explicitly — see docs/RESOURCE_CLOSURE.md §9.
# See docs/RESOURCE_CLOSURE.md.
tune-table = []
# Phase 7: article-layout compiler (encoder-side reordering + decoder id-sort).
reorder = []
# Phase 8: learned residual corrector (integer inference + embedded weights).
# ADOPTED: the frozen quantized network's integer forward pass.
learned = []
# Phase 8 (research): the offline *trainer* — a floating-point shadow of the
# integer network, used only to produce `weights.bin`. Deliberately outside
# `accepted`: it is dead code in the scored build (no trainer is ever
# constructed there), it is the only thing in the tree that calls a libm
# function, and gating it out makes "the judged binary's output cannot depend on
# a floating-point library implementation" a property of the symbol table rather
# than an argument. Measured cost of carrying it: see RESOURCE_CLOSURE.md §10.
learned-train = ["learned"]
# Out-of-memory protection in the scored stub: refuse to *start* a run whose
# projected peak exceeds the budget. On by default; disabling it yields an
# otherwise-identical binary used to measure its executable cost. This is the
# scored half of the OOM guard — the runtime floor is `mem-floor`, above.
mem-guard = []
# Phase 14: codelength attribution. Research-plane: the accumulator and the
# report are outside `accepted`, so the scored stub carries none of it.
opportunity = ["vocab-price"]
# Phase 14: the bounded procedural DSL, its exact serializer, target-directed
# search and the typed residual algebra. Research-plane until a constructed
# representation is measured to beat the accepted one on the authority corpus.
procedural = []
# Phase 14 screening tools: a context-map primitive, a deep PPM distribution
# provider and a two-level mixer. Each exists to be measured against the
# incumbent at equal memory before anything is wired into the pipeline, so the
# whole group is gated together and outside `accepted`.
phase14 = []
# Phase 14.34-14.36: the temporal residual corrector. Unlike the rest of the
# `phase14` group this is a *candidate for adoption* -- it wins at every rung
# measured, including enwik9 -- so it gets its own feature rather than riding on
# `phase14`: `tools/measure_binary_cost.sh temporal` can then measure the exact
# marginal executable bytes the scored stub would pay for it, and `accepted` can
# take it (or not) as a separate, receipted decision. Implies `learned`, because
# it is a second corrector on the same inference path.
temporal = ["learned"]
# `submission` gates out research-only machinery from the decoder stub. The
# scored build enables it (`--features accepted,submission`): it compiles out the
# 95-arm research model constructor (see `Method::config_for`), whose only
# reachable configurations in the stub are the accepted chain and its
# `reorder_parent()` downgrade. Measured: 3,896 B per copy at the pinning below.
submission = []

# ---------------------------------------------------------------------------
# Profiles
#
# `release` is used by the research driver (speed matters there).
# `submission` is used to build the scored stub: size is a first-class metric.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
# `thin` LTO + multiple codegen units keeps rustc's own peak memory modest so a
# research build cannot OOM a workstation. The scored `submission` profile below
# keeps `fat`/1 for the smallest artifact.
lto = "thin"
codegen-units = 4
panic = "abort"
debug = false
strip = "symbols"
overflow-checks = false

[profile.submission]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
overflow-checks = true

[profile.bench]
inherits = "release"

# Fast research build: no LTO, many codegen units, lowest rustc memory. Use for
# quick iteration; not for scored artifacts.
[profile.research]
inherits = "release"
lto = "off"
codegen-units = 16
opt-level = 2
